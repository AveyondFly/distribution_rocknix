name: Build image

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true

jobs:
  build-aarch64-image:
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-image-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"
      - name: Remove unwanted tools
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null
      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 4096
          swap-size-mb: 4096
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get user manual PDFs bundle
        uses: actions/download-artifact@v4
        with:
          name: rocknix-user-manuals-pdfs
          path: /tmp/user-manuals-art

      - name: Stage user manual PDFs for rocknix-user-docs
        run: |
          set -e
          PRE=documentation/user_man/prebuilt-pdf
          rm -rf "${PRE}"
          mkdir -p "${PRE}"
          tar -xzf /tmp/user-manuals-art/rocknix-user-manuals-pdfs.tar.gz -C "${PRE}"
          ls -la "${PRE}"

      - name: Get DtbselectWin64 (PyInstaller) for /flash
        if: inputs.DEVICE == 'RK3326'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dtbselect-rk3326-windows
          path: /tmp/dtbw-art

      - name: Stage DtbselectWin64.exe (RK3326 prebuilt for package)
        if: inputs.DEVICE == 'RK3326'
        run: |
          set -e
          PRE=projects/ROCKNIX/devices/RK3326/packages/rk3326-dtb-select/prebuilt
          rm -rf "${PRE}"
          mkdir -p "${PRE}"
          if [ -f /tmp/dtbw-art/dtbselect-rk3326-windows-x64.zip ]; then
            unzip -o /tmp/dtbw-art/dtbselect-rk3326-windows-x64.zip -d /tmp/dtbw-ex
            if [ -f /tmp/dtbw-ex/DtbselectWin64.exe ]; then
              cp -a /tmp/dtbw-ex/DtbselectWin64.exe "${PRE}/DtbselectWin64.exe"
              ls -la "${PRE}/DtbselectWin64.exe"
            else
              echo "Zip has no DtbselectWin64.exe; Windows installer skipped in image"
            fi
          else
            echo "No dtbselect-rk3326-windows artifact; building image without DtbselectWin64.exe on /flash"
          fi

      - name: Get DtbselectWin64 (PyInstaller) for RK3566 /flash
        if: inputs.DEVICE == 'RK3566'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dtbselect-rk3566-windows
          path: /tmp/dtbw3566-art

      - name: Stage DtbselectWin64.exe (RK3566 prebuilt for package)
        if: inputs.DEVICE == 'RK3566'
        run: |
          set -e
          PRE=projects/ROCKNIX/devices/RK3566/packages/rk3566-dtb-select/prebuilt
          rm -rf "${PRE}"
          mkdir -p "${PRE}"
          if [ -f /tmp/dtbw3566-art/dtbselect-rk3566-windows-x64.zip ]; then
            unzip -o /tmp/dtbw3566-art/dtbselect-rk3566-windows-x64.zip -d /tmp/dtbw3566-ex
            if [ -f /tmp/dtbw3566-ex/DtbselectWin64.exe ]; then
              cp -a /tmp/dtbw3566-ex/DtbselectWin64.exe "${PRE}/DtbselectWin64.exe"
              ls -la "${PRE}/DtbselectWin64.exe"
            else
              echo "Zip has no DtbselectWin64.exe; Windows build skipped in image"
            fi
          else
            echo "No dtbselect-rk3566-windows artifact; building image without DtbselectWin64.exe on /flash"
          fi

      - name: Get DtbselectWin64 (PyInstaller) for RK356X /flash
        if: inputs.DEVICE == 'RK356X'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dtbselect-rk356x-windows
          path: /tmp/dtbw356x-art

      - name: Stage DtbselectWin64.exe (RK356X RK3562 prebuilt for package)
        if: inputs.DEVICE == 'RK356X'
        run: |
          set -e
          PRE=projects/ROCKNIX/devices/RK356X/packages/rk356x-dtb-select/prebuilt
          rm -rf "${PRE}"
          mkdir -p "${PRE}"
          if [ -f /tmp/dtbw356x-art/dtbselect-rk356x-windows-x64.zip ]; then
            unzip -o /tmp/dtbw356x-art/dtbselect-rk356x-windows-x64.zip -d /tmp/dtbw356x-ex
            if [ -f /tmp/dtbw356x-ex/DtbselectWin64.exe ]; then
              cp -a /tmp/dtbw356x-ex/DtbselectWin64.exe "${PRE}/DtbselectWin64.exe"
              ls -la "${PRE}/DtbselectWin64.exe"
            else
              echo "Zip has no DtbselectWin64.exe; Windows build skipped in image"
            fi
          else
            echo "No dtbselect-rk356x-windows artifact; building image without DtbselectWin64.exe on /flash"
          fi

      - name: Get DtbselectWin64 (PyInstaller) for RK356X RK3566-Specific /flash
        if: inputs.DEVICE == 'RK356X'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dtbselect-rk3566-windows
          path: /tmp/dtbw3566-rk356x-art

      - name: Stage DtbselectWin64.exe (RK356X RK3566-Specific prebuilt for package)
        if: inputs.DEVICE == 'RK356X'
        run: |
          set -e
          PRE=projects/ROCKNIX/devices/RK356X/packages/rk3566-dtb-select/prebuilt
          rm -rf "${PRE}"
          mkdir -p "${PRE}"
          if [ -f /tmp/dtbw3566-rk356x-art/dtbselect-rk3566-windows-x64.zip ]; then
            unzip -o /tmp/dtbw3566-rk356x-art/dtbselect-rk3566-windows-x64.zip -d /tmp/dtbw3566-rk356x-ex
            if [ -f /tmp/dtbw3566-rk356x-ex/DtbselectWin64.exe ]; then
              cp -a /tmp/dtbw3566-rk356x-ex/DtbselectWin64.exe "${PRE}/DtbselectWin64.exe"
              ls -la "${PRE}/DtbselectWin64.exe"
            else
              echo "Zip has no DtbselectWin64.exe; Windows build skipped in RK3566-Specific image"
            fi
          else
            echo "No dtbselect-rk3566-windows artifact; building RK3566-Specific image without DtbselectWin64.exe on /flash"
          fi

      - name: Download arm (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8650' }}
        uses: actions/download-artifact@v4
        with:
          name: arm (${{ inputs.DEVICE }})

      - name: Extract artifact arm
        if: ${{ inputs.DEVICE != 'SM8650' }}
        run: |
          tar --zstd -xf build.arm.tar.zst

      - name: Clean up compressed arm file
        if: ${{ inputs.DEVICE != 'SM8650' }}
        run: rm build.arm.tar.zst
        
      - name: Download emu-libretro (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v4
        with:
          name: emu-libretro (${{ inputs.DEVICE }})

      - name: Extract artifact emu-libretro
        run: |
          cat build.emu-libretro.tar.part* > build.emu-libretro.tar
          tar -xf build.emu-libretro.tar

      - name: Clean up compressed emu-libretro file
        run: rm build.emu-libretro.tar*

      - name: Download emu-standalone (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v4
        with:
          name: emu-standalone (${{ inputs.DEVICE }})

      - name: Extract artifact emu-standalone
        run: |
          cat build.emu-standalone.tar.part* > build.emu-standalone.tar
          tar --skip-old-files -xf build.emu-standalone.tar

      - name: Clean up compressed emu-standalone file
        run: rm build.emu-standalone.tar*

      # clean to rebuild retroarch with 32bit enabled
      - name: Clean retroarch
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean retroarch"
      # clean to rebuild emulationstation with credentials
      - name: Clean emulationstation
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean emulationstation"

      - name: build
        run: |
          ./scripts/get_env > .env
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-image)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-image)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: AURKNIX-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/AURKNIX-*.img.gz
            target/AURKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AURKNIX-update-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/AURKNIX-*.tar
            target/AURKNIX-*.tar.sha256
          compression-level: 0
          if-no-files-found: error
