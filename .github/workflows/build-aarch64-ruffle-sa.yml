name: Build ruffle-sa

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string

jobs:
  build-aarch64-ruffle-sa:
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-ruffle-sa-${{ github.sha }}
      RUST_CACHE_PREFIX: rust-cache-v2-aarch64-${{ inputs.DEVICE }}-ruffle-sa.tar.part-
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          remove-cached-tools: true
          remove-swapfile: true
          verbose: false
      - name: Remove unwanted tools
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null
      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: false
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v4
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            tar --zstd -xf build.aarch64-toolchain.tar.zst
          max_attempts: 3
          retry_interval: 10

      - name: Clean up compressed aarch64-toolchain file
        run: rm build.aarch64-toolchain.tar.zst

      - name: Retrieve ccache
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache"
          PREFIX="ccache-aarch64-${{ inputs.DEVICE }}-ruffle-sa.tar.part-"
          found_any=0
          for suffix in $(printf "%s\n" {a..z}{a..z}); do
            FILE="${PREFIX}${suffix}"
            URL="${BASE}/${FILE}"

            echo "Trying $URL"
            if curl -L --fail --silent --show-error -o "$FILE" "$URL"; then
              echo "Downloaded $FILE"
              found_any=1
            else
              echo "No more parts found at $URL"
              break
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "No ccache found, skipping."
            exit 0
          fi
          cat ${PREFIX}* > ccache.tar
          tar -xf ccache.tar || { echo "Extract failed"; exit 0; }
          rm -f ${PREFIX}* ccache.tar

      - name: Retrieve rust cache
        run: |
          ./scripts/ci_rust_cache restore \
            "https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache" \
            "${RUST_CACHE_PREFIX}"

      - name: Build
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt ruffle-sa"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-ruffle-sa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-ruffle-sa)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 2G
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        run: |
          tar --remove-files -cf - ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache \
            | split -b 1900m - ccache-aarch64-${{ inputs.DEVICE }}-ruffle-sa.tar.part-

      - name: Save ccache
        uses: ncipollo/release-action@v1
        with:
          tag: ccache
          artifacts: "ccache-aarch64-${{ inputs.DEVICE }}-ruffle-sa.tar.part-*"
          allowUpdates: true
          makeLatest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repo: ${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Compress directory
        run: |
          BUILD="./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64"
          mapfile -t paths < <(./scripts/ci_rust_cache artifact-paths "${BUILD}")
          echo "Packing ${#paths[@]} ruffle-sa artifact path(s):"
          printf '  %s\n' "${paths[@]}"
          tar --zstd -cf build.ruffle-sa.tar.zst "${paths[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ruffle-sa (${{ inputs.DEVICE }})
          path: build.ruffle-sa.tar.zst
          compression-level: 0
          if-no-files-found: error

      - name: Tar rust cache
        id: rust_cache
        run: |
          ./scripts/ci_rust_cache archive \
            "./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64" \
            "${RUST_CACHE_PREFIX}" \
            --remove-files
          shopt -s nullglob
          parts=(${RUST_CACHE_PREFIX}*)
          if [ ${#parts[@]} -gt 0 ]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save rust cache
        if: steps.rust_cache.outputs.found == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ccache
          artifacts: "${{ env.RUST_CACHE_PREFIX }}*"
          allowUpdates: true
          makeLatest: true
          prerelease: true
          body: rust-cache-v2
          token: ${{ secrets.GH_PAT }}
          repo: ${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true
