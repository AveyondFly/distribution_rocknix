name: Update mirror sources

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  workflow_call:

jobs:
  get-sources:
    if: (github.event_name != 'schedule') || (github.repository == 'AveyondFly/distribution_rocknix' && github.ref_name == 'next')
    name: Get sources (${{ matrix.device }})
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    strategy:
      fail-fast: false
      matrix:
        device: [RK3326, RK3326S, RK3566, RK356X, S905]
    steps:
      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: false
          root-reserve-mb: 6144
          swap-size-mb: 4096
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: get sources (${{ matrix.device }})
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            PROJECT=ROCKNIX DEVICE=${{ matrix.device }} GET_HANDLER_SUPPORT="archive file" ./tools/download-tool > /tmp/download-${{ matrix.device }}.log 2>&1 || tail -n 200 /tmp/download-${{ matrix.device }}.log
            test "$(find sources/ -type f \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.tgz' -o -name '*.tar.bz2' -o -name '*.deb' -o -name '*.tar.zst' \) | wc -l)" -gt 0
          max_attempts: 6
          retry_interval: 10
      - name: print number of downloaded artifacts
        run: find sources/ -type f \( -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.tgz" -o -name "*.tar.bz2" -o -name "*.deb" -o -name "*.tar.zst" \) | wc -l
      - name: push missing sources
        run: |
          set -euo pipefail
          REPO="${{ github.repository_owner }}/distribution-sources"
          gh release view sources --repo "$REPO" >/dev/null 2>&1 || \
            gh release create sources --repo "$REPO" --prerelease --title sources --notes sources --target main || true

          RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/sources" --jq '.id')
          EXISTING_FILES=$(gh api --paginate "repos/${REPO}/releases/${RELEASE_ID}/assets" --jq '.[].name' || true)
          : > missing-artifacts.txt
          while IFS= read -r -d '' file; do
            BASENAME=$(basename "$file")
            if ! printf '%s\n' "$EXISTING_FILES" | grep -qx "$BASENAME"; then
              printf '%s\n' "$file" >> missing-artifacts.txt
            fi
          done < <(find sources/ -type f \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.tgz' -o -name '*.tar.bz2' -o -name '*.deb' -o -name '*.tar.zst' \) -print0)

          COUNT=$(grep -c . missing-artifacts.txt || true)
          echo "Missing count: ${COUNT}"
          [ "${COUNT}" -eq 0 ] && exit 0

          mapfile -t FILES < <(grep -v '^$' missing-artifacts.txt)
          total=${#FILES[@]}
          failed=0
          echo "Uploading ${total} artifacts to ${REPO}"
          for file in "${FILES[@]}"; do
            uploaded=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if out=$(gh release upload sources "$file" --repo "$REPO" 2>&1); then
                echo "Uploaded $(basename "$file")"
                uploaded=1
                break
              fi
              if printf '%s\n' "$out" | grep -qiE 'already_exists|already exists'; then
                echo "Already present: $(basename "$file")"
                uploaded=1
                break
              fi
              if printf '%s\n' "$out" | grep -qiE 'secondary rate limit|rate limit|HTTP 429|HTTP 403|HTTP 502|HTTP 503|HTTP 504|timeout'; then
                echo "Rate-limited or transient error on $(basename "$file"), retry ${attempt}/8"
                sleep $((attempt * 5 + RANDOM % 5))
                continue
              fi
              printf '%s\n' "$out"
              break
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "Upload failed: $(basename "$file")"
              failed=$((failed + 1))
            fi
            sleep $((1 + RANDOM % 3))
          done
          [ "$failed" -eq 0 ]
      - name: upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: download-log-${{ matrix.device }}
          path: /tmp/download-${{ matrix.device }}.log
          if-no-files-found: ignore
          retention-days: 3
