name: Update mirror sources

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  workflow_call:

jobs:
  update-mirror-sources:
    if: (github.event_name != 'schedule') || (github.repository == 'AveyondFly/distribution_rocknix' && github.ref_name == 'next')
    name: Update mirror sources
    runs-on: ubuntu-24.04
    env:
      SKIP_GIT: true
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: false
          root-reserve-mb: 6144
          swap-size-mb: 4096
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install xmlstarlet
        run: sudo apt-get install xmlstarlet
      - name: get sources
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            PROJECT=ROCKNIX DEVICE=RK3326 ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=RK3326S ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=RK3399 ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=RK3566 ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=RK3588 ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=H700 ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=S922X ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=SM8250 ./tools/download-tool 
            PROJECT=ROCKNIX DEVICE=SM8550 ./tools/download-tool
          max_attempts: 6
          retry_interval: 10
      - name: print number of downloaded artifacts
        run: find sources/ -type f \( -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.tgz" -o -name "*.tar.bz2" -o -name "*.deb" \) | wc -l
      - name: Find missing artifacts
        id: find_missing
        run: |
          set -euo pipefail
          REPO="${{ github.repository_owner }}/distribution-sources"
          gh release view sources --repo "$REPO" >/dev/null 2>&1 || \
            gh release create sources --repo "$REPO" --prerelease --title sources --notes sources --target main

          EXISTING_FILES=$(gh release view sources --repo "$REPO" --json assets --jq '.assets[].name' || true)
          : > missing-artifacts.txt
          while IFS= read -r -d '' file; do
            BASENAME=$(basename "$file")
            if ! printf '%s\n' "$EXISTING_FILES" | grep -qx "$BASENAME"; then
              echo "Missing: $file"
              printf '%s\n' "$file" >> missing-artifacts.txt
            fi
          done < <(find sources/ -type f \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.tgz' -o -name '*.tar.bz2' -o -name '*.deb' -o -name '*.tar.zst' \) -print0)

          COUNT=$(grep -c . missing-artifacts.txt || true)
          echo "Missing count: ${COUNT}"
          if [ "${COUNT}" -eq 0 ]; then
            echo "No missing files to upload."
            echo "HAS_MISSING=false" >> "$GITHUB_ENV"
          else
            echo "HAS_MISSING=true" >> "$GITHUB_ENV"
          fi
      - name: push sources
        if: env.HAS_MISSING == 'true'
        run: |
          set -euo pipefail
          REPO="${{ github.repository_owner }}/distribution-sources"
          BATCH_SIZE=10
          mapfile -t FILES < <(grep -v '^$' missing-artifacts.txt)
          total=${#FILES[@]}
          echo "Uploading ${total} artifacts to ${REPO}"
          i=0
          while [ "$i" -lt "$total" ]; do
            batch=("${FILES[@]:i:BATCH_SIZE}")
            echo "Uploading $((i+1))-$((i+${#batch[@]})) / ${total}"
            gh release upload sources "${batch[@]}" --repo "$REPO"
            i=$((i + ${#batch[@]}))
          done
