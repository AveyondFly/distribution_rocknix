# ROCKNIX S905L3A configuration
# Uncomment and modify options as needed

# HDMI output mode (default: 1080p60hz)
# vout=1080p60hz

# HDMI color attribute override (empty = auto)
hdmitx=

# HDR policy (0=follow sink, 1=follow source)
hdr_policy=0

# Kernel log verbosity (1=quiet, 0=show kernel messages)
quiet=1

# Fractional refresh rate (0=off, 1=on)
# frac_rate_policy=0

# Console serial port
# consoleopt=console=ttyAML0,115200

# HDMI CEC (0a=all functions)
# cec_func_config=0a

# Fixed Ethernet MAC address (set if IP changes every boot)
# mac=00:15:18:01:81:31

# Wake-on-LAN (0=off, 1=on)
# wol=0

# GPIO power button pin
# gpiopower=

# Max CPU frequency (in Hz)
# max_freq_a53=1908000000
