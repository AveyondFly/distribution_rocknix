#
# RK817 on RK3326S 5.10: ACP marks Speaker/Headphone jacks unavailable, so
# stereo-fallback never comes up. Prefer direct ALSA nodes (pro-audio).

monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "rockchip-rk817" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  }
]
