#
# RK817 on dArkOS 5.10: stock UCM references Playback Mux but the driver
# exposes Playback Path, so ACP cannot create sinks. Use direct ALSA nodes.

monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "rockchip-rk817" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  }
]
