#
# SC2/S905X4 HDMI audio via ALSA hw:0,0 (SPDIF-B-dummy), matching CoreELEC Kodi
# (ALSA:surround71:CARD=AMLAUGESOUND,DEV=0) without probing TDM-C/TDM-B PCMs.

[General]
auto-profiles = no

[Mapping hdmi-spdif-b]
device-strings = hw:%f,0
channel-map = front-left,front-right
description = HDMI Audio (SPDIF-B)
direction = output
priority = 100

[Profile output:hdmi-stereo]
output-mappings = hdmi-spdif-b
description = HDMI Stereo
priority = 100
skip-probe = yes
