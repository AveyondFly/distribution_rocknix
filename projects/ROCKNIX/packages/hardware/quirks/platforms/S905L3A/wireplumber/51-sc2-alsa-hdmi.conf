# CoreELEC does not let WirePlumber enumerate AML-AUGESOUND; Kodi opens ALSA
# directly. PipeWire/WirePlumber ACP probing opens the TDM PCMs repeatedly and
# triggers aml_tdm mclk warnings, so keep this card out of automatic probing.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*auge_sound.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
