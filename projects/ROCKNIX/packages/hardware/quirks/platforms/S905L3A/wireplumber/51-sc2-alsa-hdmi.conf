#
# SC2/S905X4: route HDMI audio via SPDIF-B (hw:0,0), matching CoreELEC.
# Disable TDM-B/TDM-C nodes so WirePlumber does not probe broken PCMs and
# trigger aml_tdm lane/mclk warnings in the kernel log.

monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "AML-AUGESOUND" }
    ]
    actions = {
      update-props = {
        device.profile = "output:hdmi-stereo"
      }
    }
  }
  {
    matches = [
      { alsa.card_name = "AML-AUGESOUND" api.alsa.path = "~hw:.*,1" }
      { alsa.card_name = "AML-AUGESOUND" api.alsa.path = "~hw:.*,3" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
