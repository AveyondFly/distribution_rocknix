# SC2/S905X4: route HDMI audio via SPDIF-B (hw:0,0), matching CoreELEC.
# Disable TDM-B/TDM-C nodes so WirePlumber does not expose broken PCMs while
# keeping the normal ALSA card/profile path for SDL/PulseAudio applications.

monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "AML-AUGESOUND" }
    ]
    actions = {
      update-props = {
        device.profile = "output:hdmi-stereo"
      }
    }
  }
  {
    matches = [
      { alsa.card_name = "AML-AUGESOUND" api.alsa.path = "~hw:.*,1" }
      { alsa.card_name = "AML-AUGESOUND" api.alsa.path = "~hw:.*,3" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.alsa.path = "hw:0,0" }
      { node.name = "~alsa_output.*hdmi-spdif-b" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ "FL", "FR" ]
      }
    }
  }
]
